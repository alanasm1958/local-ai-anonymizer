name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The bundled model (about 63 MB) is downloaded once per pinned revision, not on every run.
      - uses: actions/cache@v4
        with:
          path: vendor/models
          key: model-${{ hashFiles('src/core/ner.js') }}

      - name: Install (also bundles the runtime and model into vendor/)
        run: npm ci

      - run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Install Chromium for the browser tests
        run: npx playwright-core install chromium

      - name: Browser tests (real extension, real model)
        run: npm run test:e2e

      - name: Build the release zip
        run: npm run package

      - name: Extract the release zip
        run: node scripts/extract-zip.mjs "${{ runner.temp }}/pkg"

      - name: Browser tests against the release zip
        run: npm run test:e2e
        env:
          EXTENSION_PATH: ${{ runner.temp }}/pkg
