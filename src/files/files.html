<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean or Restore Files</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="files.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <img src="../../icons/icon-48.png" alt="" width="40" height="40">
      <div>
        <h1>Clean or restore files</h1>
        <p class="muted">Everything happens on this device. Files are never uploaded anywhere.</p>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" class="tab" data-mode="clean" aria-selected="true">Clean files</button>
      <button role="tab" class="tab" data-mode="restore" aria-selected="false">Restore files</button>
    </nav>

    <section class="card">
      <p id="mode-help" class="muted"></p>
      <label id="drop" class="drop" for="file-input">
        <input id="file-input" type="file" multiple>
        <strong id="drop-title">Drop files here</strong>
        <span class="muted">or <u>choose files</u></span>
      </label>
      <div id="results" class="results" aria-live="polite"></div>
    </section>
  </div>
  <script type="module" src="files.js"></script>
</body>
</html>
